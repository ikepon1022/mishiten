<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1769aa"><meta name="description" content="三島市の今日と明日の天気をチェック。"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon-192.png"><link rel="apple-touch-icon" href="./icon-192.png"><link rel="stylesheet" href="./style.css"><title>みしてん | 三島市の天気</title></head><body><main class="wrap"><header><div><h1>☀️ みしてん <small>MISHITEN</small></h1><p>三島の空を、もっと身近に。</p></div><button id="reload" aria-label="天気を更新">↻ 更新</button></header><section class="hero" aria-live="polite"><div class="location">📍 静岡県 三島市</div><div class="hero-content"><div><p id="date">今日</p><div class="current"><span id="currentTemp">--</span><span>°C</span></div><h2 id="condition">天気を取得中</h2></div><div id="bigIcon" class="big-icon">☀️</div></div><div class="metrics"><span id="high">最高 --°</span><span id="low">最低 --°</span><span id="rain">☂ --%</span></div></section><p id="status" class="status" role="status">最新の天気を取得しています…</p><h2 class="section-title">今日と明日の天気</h2><div id="days" class="days"><button class="day active" data-index="0"><strong>今日</strong><span class="weather-icon">☀️</span><span class="summary">--</span><b class="temps">--° / --°</b><span class="chance">☂ --%</span></button><button class="day" data-index="1"><strong>明日</strong><span class="weather-icon">☀️</span><span class="summary">--</span><b class="temps">--° / --°</b><span class="chance">☂ --%</span></button></div><section class="panel"><h2 id="hourTitle">今日の時間別予報</h2><div id="hours" class="hours"></div></section><section class="advice"><h2>💡 みしてんのひとこと</h2><p id="tip">最新の天気を取得すると、お出かけのヒントが表示されます。</p></section><footer>天気データ：<a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a>。予報は変更される場合があります。<br>通信できないときは、最後に取得した予報を表示します。<br><a href="https://www.jma.go.jp/bosai/forecast/" target="_blank" rel="noopener">気象庁の天気予報</a>も確認できます。<span id="version">v1.0.0</span></footer></main><script src="./app.js" defer></script></body></html>
